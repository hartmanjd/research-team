# Render blueprint for the website (web/). Render reads this file when the repo is connected.
services:
  - type: web
    name: visa-employer-watch
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/meta
